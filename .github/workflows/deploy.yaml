name: Deploy Docs

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

# Preview and production both update gh-pages, so never run their writers together.
concurrency:
  group: chatshare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict
      - name: Publish root docs and retain preview
        shell: bash
        run: |
          set -euo pipefail
          deploy_dir="${RUNNER_TEMP}/chatshare-gh-pages"
          preserve_dir="${RUNNER_TEMP}/chatshare-pages-preserve"
          trap 'cd "${GITHUB_WORKSPACE}"; git worktree remove --force "${deploy_dir}" || true' EXIT

          git fetch --no-tags origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach "${deploy_dir}" refs/remotes/origin/gh-pages
          mkdir -p "${preserve_dir}"
          for name in dev versions.json; do
            if [ -e "${deploy_dir}/${name}" ]; then
              cp -a "${deploy_dir}/${name}" "${preserve_dir}/${name}"
            fi
          done

          cd "${deploy_dir}"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "${GITHUB_WORKSPACE}/site/." .
          for name in dev versions.json; do
            if [ -e "${preserve_dir}/${name}" ]; then
              cp -a "${preserve_dir}/${name}" "${name}"
            fi
          done

          git add --all
          if git diff --cached --quiet; then
            echo "Pages content is unchanged."
            exit 0
          fi
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "Deploy docs for ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
